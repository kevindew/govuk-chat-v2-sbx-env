# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Allowed hosts
description: Hosts GOV.UK Chat v2 development needs beyond those other kits allow

capabilities:
  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          # CDK pulls AWS SAM build images from here to bundle assets
          - public.ecr.aws
          # ECR Public's CDN, which public.ecr.aws redirects layer downloads to
          - d2glxqk2uabbnd.cloudfront.net
          # Amazon Linux build images
          - cdn.amazonlinux.com
          # AWS service endpoints, such as sts.eu-west-1.amazonaws.com
          - "**.amazonaws.com"
