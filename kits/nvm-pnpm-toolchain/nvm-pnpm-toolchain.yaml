# syntax=docker/sandbox-kit:3
# Node toolchain: nvm, the project's Node version, pnpm and dependencies.
schemaVersion: "3"
kind: mixin
displayName: nvm and pnpm toolchain
description: nvm, the project's Node version, pnpm and pnpm dependencies

capabilities:
  # nvm is cloned from GitHub on create. At runtime nvm downloads Node from
  # nodejs.org and npm and pnpm download packages from the npm registry
  - type: com.docker.sandbox/network-policy@2
    config:
      install:
        allow:
          - github.com
      runtime:
        allow:
          - nodejs.org
          - registry.npmjs.org

  # Install hooks run once on create; startup hooks run on every start so the
  # Node and pnpm versions track .nvmrc and package.json, as
  # scripts/dev-prepare.zsh does. All are no-ops when already installed. The
  # startup hook also puts that Node on PATH for Claude Code's shells.
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - description: Install nvm and load it in bash
          user: "1000"
          command: |
            export HOME=/home/agent NVM_DIR=/home/agent/.nvm
            if [ ! -d "$NVM_DIR" ]; then
              # Latest release tag, as master may hold unreleased changes
              tag=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/nvm-sh/nvm.git 'v*' | head -n 1 | sed 's|.*/||')
              git clone --depth 1 --branch "$tag" https://github.com/nvm-sh/nvm.git "$NVM_DIR"
            fi
            # The base image sets NPM_CONFIG_PREFIX, which nvm refuses to run with
            grep -q nvm.sh "$HOME/.bashrc" || printf '%s\n' 'unset NPM_CONFIG_PREFIX' 'export NVM_DIR="$HOME/.nvm"' '. "$NVM_DIR/nvm.sh"' >> "$HOME/.bashrc"
      startup:
        # pnpm is installed at the packageManager version from package.json
        - description: Install the project's Node, pnpm and pnpm dependencies
          env: [WORKSPACE_DIR, CLAUDE_ENV_FILE]
          command:
            - bash
            - -c
            - |
              unset NPM_CONFIG_PREFIX
              export HOME=/home/agent NVM_DIR=/home/agent/.nvm
              # nvm.sh returns non-zero when no Node is installed yet
              . "$NVM_DIR/nvm.sh" || true
              set -e
              cd "$WORKSPACE_DIR"
              nvm install
              # So new shells get the .nvmrc version, including after it changes
              nvm alias default "$(nvm current)"
              # Claude Code's Bash tool doesn't read .bashrc, only
              # CLAUDE_ENV_FILE. Put the Node bin dir on PATH there directly, as
              # sourcing nvm.sh before every command is slow
              env_file=${CLAUDE_ENV_FILE:-/etc/sandbox-persistent.sh}
              touch "$env_file"
              # Rewritten in place, as sed -i needs a temp file in /etc, which
              # agent can't create
              rest=$(sed '/^# >>> nvm-pnpm-toolchain >>>$/,/^# <<< nvm-pnpm-toolchain <<<$/d' "$env_file")
              {
                [ -z "$rest" ] || printf '%s\n' "$rest"
                printf '%s\n' \
                  '# >>> nvm-pnpm-toolchain >>>' \
                  'unset NPM_CONFIG_PREFIX' \
                  'export NVM_DIR="$HOME/.nvm"' \
                  "export PATH=\"\$NVM_DIR/versions/node/$(nvm current)/bin:\$PATH\"" \
                  '# <<< nvm-pnpm-toolchain <<<'
              } > "$env_file"
              pm=$(node -p 'require("./package.json").packageManager')
              [ "pnpm@$(pnpm --version 2>/dev/null)" = "$pm" ] || npm install -g "$pm"
              pnpm install
