# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: mise dependencies
description: Using mise to install the projects dependencies

capabilities:
  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          - nodejs.org
          - registry.npmjs.org
          # Python and uv binaries come from GitHub releases
          - api.github.com
          - github.com
          - release-assets.githubusercontent.com
          - objects.githubusercontent.com
          # mise looks up precompiled Python builds here
          - mise-versions.jdx.dev
          # Trust root for verifying uv's GitHub artifact attestations
          - tuf-repo-cdn.sigstore.dev
          # PyPI's index and package files, for uv and the CDK Python
          # bundling script
          - pypi.org
          - files.pythonhosted.org
          # AWS CLI downloads
          - awscli.amazonaws.com

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Mise config in the sandbox, not the workspace.
        # TODO: If mise works for us set up a mise config in the repo
        - description: Use mise to install dependencies in the sandbox
          user: "1000"
          command: |
            mkdir -p /home/agent/.config/mise
            cat > /home/agent/.config/mise/config.toml <<'TOML'
            [settings]
            idiomatic_version_file_enable_tools = ["node", "pnpm", "python"]

            [tools]
            # May want to add a .tools-version file to govuk-chat-v2 to set the
            # version while still supporting the setup-uv action
            uv = "latest"
            aws-cli = "latest"
            TOML
        # The workspace is a separate filesystem from $HOME, so without this
        # pnpm puts its store in the workspace root as .pnpm-store.
        - description: Keep the pnpm store out of the workspace
          user: "1000"
          command: |
            mkdir -p /home/agent/.config/pnpm
            echo "store-dir=/home/agent/.local/share/pnpm/store" > /home/agent/.config/pnpm/rc
      startup:
        - description: Install mise and subsequent dependencies
          env: [WORKSPACE_DIR]
          command:
            - bash
            - -c
            - |
              set -eu
              export HOME=/home/agent
              . /etc/profile.d/mise-env.sh
              cd "$WORKSPACE_DIR"
              mise install

              pnpm install

              uv sync --all-packages --dev
