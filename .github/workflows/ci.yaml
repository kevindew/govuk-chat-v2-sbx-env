name: CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm
        run: npm install -g "$(jq -r .packageManager package.json)"

      - uses: actions/setup-node@v6.2.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: scripts/format.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.2.8

      - name: Lint mise config
        run: mise run lint

  validate-kits:
    name: Validate SBX kits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate kits
        run: scripts/validate-kits.sh

  sbx-env-plan:
    name: Test run sbx env plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install sbx
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get install -y docker-sbx

      # Checks sbxenv.yaml without a Docker sign-in. It doesn't validate the
      # kits themselves, as that needs a builder sandbox. The workspace has to
      # exist, but can be empty.
      - name: Run sbx env plan
        run: |
          mkdir govuk-chat-v2
          sbx env plan --no-input
