schemaVersion: "1"
name: govuk-chat-v2
agent: claude

kits:
  - docker.io/sbx/claude:latest
  - ./kits/gds-llm-gateway
  - docker.io/sbx/mise:latest
  - ./kits/mise-dependencies
  - ./kits/allowed-hosts

workspace: ./govuk-chat-v2

# Route Claude Code through the AI Engineering Lab gateway instead of
# api.anthropic.com. ANTHROPIC_AUTH_TOKEN comes from the gds-llm-gateway mixin.
env:
  ANTHROPIC_BASE_URL: https://licenseportal.aiengineeringlab.co.uk
  ANTHROPIC_DEFAULT_OPUS_MODEL: eu.anthropic.claude-opus-5-5
  ANTHROPIC_DEFAULT_SONNET_MODEL: eu.anthropic.claude-sonnet-5-5
  ANTHROPIC_DEFAULT_HAIKU_MODEL: eu.anthropic.claude-haiku-4-5-20251001-v1:0
  CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"

# Start Claude Code in auto mode instead of the kit's default of
# --dangerously-skip-permissions.
cmd: [--permission-mode, auto]

# These run on the host, so they can pass host values into the sandbox.
lifecycle:
  postCreate:
    # The CDK app needs USER, which isn't set in the sandbox.
    - name: Set USER to the host user with a -sbx suffix
      command: |
        sbx exec -u root "$SBX_SANDBOX_NAME" sh -c 'printf "export USER=%s\n" "$1" >> /etc/sandbox-persistent.sh' sh "$USER-sbx"
    # The sandbox proxy passes Docker registry traffic straight through, so
    # Zscaler intercepts it.
    - name: Trust the host's Zscaler root CA in the sandbox
      command: |
        if security find-certificate -c "Zscaler Root CA" >/dev/null 2>&1; then
          security find-certificate -c "Zscaler Root CA" -p |
            sbx exec -i -u root "$SBX_SANDBOX_NAME" sh -c 'cat > /usr/local/share/ca-certificates/zscaler-root-ca.crt && update-ca-certificates'
        fi

secrets:
  gds-anthropic-auth-token:
    command: jq -r .env.ANTHROPIC_AUTH_TOKEN "$HOME/.claude/settings.json"
